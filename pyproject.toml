[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yukti"
version = "0.1.0"
description = "A local-first prototype for governed model learning"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
yukti = "yukti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
